name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

# Cancel redundant runs on same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # 1. Lint – auto-fixes and commits back to PR
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Auto-fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      fixed: ${{ steps.autocommit.outputs.changes_detected }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install deps
        working-directory: client
        run: npm ci --prefer-offline 2>/dev/null || npm install

      - name: Run ESLint with auto-fix
        working-directory: client
        run: npx eslint src --fix --ext .js,.jsx,.ts,.tsx || true

      - name: Commit auto-fixes back to branch
        id: autocommit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix: auto-fix lint errors [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Lint must now pass cleanly
        working-directory: client
        run: npx eslint src --ext .js,.jsx,.ts,.tsx --max-warnings 0

  # ─────────────────────────────────────────────
  # 2. Build (Next.js → .next/)
  # ─────────────────────────────────────────────
  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install deps
        working-directory: client
        run: npm ci --prefer-offline 2>/dev/null || npm install

      - name: Build
        working-directory: client
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          # Next.js outputs to .next/ (not build/)
          include-hidden-files: true
          path: client/.next
          retention-days: 1

  # ─────────────────────────────────────────────
  # 3. Link / 404 checker via next start
  # ─────────────────────────────────────────────
  check-404:
    name: Check for 404s
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install deps
        working-directory: client
        run: npm ci --prefer-offline 2>/dev/null || npm install

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: client/.next

      - name: Install linkinator
        run: npm install -g linkinator

      - name: Start Next.js and check all internal links
        run: |
          cd client
          npx next start -p 3001 &
          SERVER_PID=$!

          # Wait up to 30 s for the server to be ready
          READY=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" = "0" ]; then
            echo "::error::Next.js server did not start within 30 s"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          # Check the primary HTML routes only.
          # The generic crawler was following Next.js asset internals, so we
          # keep this focused on real page links from the rendered HTML.
          LINK_EXIT=0
          node --input-type=module <<'NODE' || LINK_EXIT=$?
          import { writeFileSync } from 'node:fs';

          const base = new URL('http://localhost:3001');
          const pages = ['/', '/council', '/fleet', '/settings'];
          const anchorChecks = new Map([
            ['/', ['about', 'viewing-room']],
          ]);
          const rows = ['url,status,state,parent,failureDetails'];
          const checked = new Set();
          let hasFailure = false;

          const escapeCsv = (value) => {
            const text = String(value ?? '');
            return `"${text.replace(/"/g, '""')}"`;
          };

          const addRow = (url, status, state, parent, failureDetails) => {
            rows.push(
              [url, status, state, parent, failureDetails].map(escapeCsv).join(',')
            );
          };

          const checkResponse = async (url, parent = '') => {
            if (checked.has(url)) return;
            checked.add(url);

            try {
              const response = await fetch(url);
              addRow(url, response.status, response.ok ? 'pass' : 'fail', parent, response.ok ? '' : `HTTP ${response.status}`);
              if (!response.ok) {
                hasFailure = true;
              }
              return response.ok ? await response.text() : '';
            } catch (error) {
              const message = error instanceof Error ? error.message : 'Request failed';
              addRow(url, 0, 'fail', parent, message);
              hasFailure = true;
              return '';
            }
          };

          for (const page of pages) {
            const pageUrl = new URL(page, base).toString();
            const html = await checkResponse(pageUrl);
            if (!html) continue;

            const requiredAnchors = anchorChecks.get(page) ?? [];
            for (const anchor of requiredAnchors) {
              const hasAnchor = new RegExp(`id=["']${anchor}["']`, 'i').test(html) || new RegExp(`name=["']${anchor}["']`, 'i').test(html);
              if (!hasAnchor) {
                addRow(`${pageUrl}#${anchor}`, 404, 'fail', pageUrl, `Missing anchor #${anchor}`);
                hasFailure = true;
              }
            }

            const hrefs = [...html.matchAll(/href="([^"]+)"/g)].map((match) => match[1]);
            for (const href of hrefs) {
              if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) continue;

              let resolved;
              try {
                resolved = new URL(href, pageUrl);
              } catch {
                continue;
              }

              if (resolved.origin !== base.origin) continue;
              if (resolved.pathname.startsWith('/_next/')) continue;
              if (resolved.pathname.startsWith('/api/')) continue;

              const targetUrl = resolved.toString();
              const targetHtml = await checkResponse(targetUrl, pageUrl);
              if (resolved.pathname === '/' && resolved.hash) {
                const anchor = resolved.hash.slice(1);
                const hasAnchor = new RegExp(`id=["']${anchor}["']`, 'i').test(targetHtml) || new RegExp(`name=["']${anchor}["']`, 'i').test(targetHtml);
                if (!hasAnchor) {
                  addRow(targetUrl, 404, 'fail', pageUrl, `Missing anchor ${resolved.hash}`);
                  hasFailure = true;
                }
              }
            }
          }

          writeFileSync('../link-report.csv', `${rows.join('\n')}\n`);
          if (hasFailure) {
            process.exit(1);
          }
          NODE

          kill $SERVER_PID 2>/dev/null || true

          if [ -n "$LINK_EXIT" ] && [ "$LINK_EXIT" != "0" ]; then
            echo "::error::Broken links detected – see link-report.csv artifact"
            exit 1
          fi

      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-report
          path: link-report*.csv
          retention-days: 7
